name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            app.py \
            nba_fetcher.py \
            mlb_fetcher.py \
            nba_simulator.py \
            mlb_simulator.py \
            team_names_zh.py \
            odds_fetcher.py
          echo "All files OK"

      - name: Import check (no-API mode)
        run: |
          python - <<'EOF'
          import importlib, sys
          # patch streamlit before importing modules
          import unittest.mock as m
          sys.modules["streamlit"] = m.MagicMock()
          for mod in ["nba_simulator", "mlb_simulator", "team_names_zh"]:
              importlib.import_module(mod)
          print("Core imports OK")
          EOF
